    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
    
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">AN1<span>.Clone</span></a>
            <div class="mobile-toggle" id="mobile-toggle">☰</div>
            
            <div class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="category.html?c=Games">Games</a>
                <a href="category.html?c=Programs">Programs</a>
                
                <form action="search.html" method="GET" class="search-bar mobile-search">
                    <input type="text" name="q" placeholder="Search..." required>
                    <button type="submit">🔍</button>
                </form>
            </div>

            <div class="header-actions">
                <form action="search.html" method="GET" class="search-bar desktop-search">
                    <input type="text" name="q" placeholder="Search..." required>
                    <button type="submit">🔍</button>
                </form>
                <button id="theme-toggle" class="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    
    <div class="container" style="margin-top: 30px; min-height: 60vh;">
        <h2 class="section-title">Latest Updates</h2>
        <div class="grid" id="latest-grid">
            <div class="loader"></div>
        </div>
    </div>
    <script type="module">
        import { db, ref, get } from './assets/js/firebase-config.js';
        import { createAppCard } from './assets/js/main.js';
        async function loadLatestApps() {
            const grid = document.getElementById('latest-grid');
            try {
                const snapshot = await get(ref(db, 'apps'));
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(key => ({id: key, ...data[key]}));
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    grid.innerHTML = apps.map(app => createAppCard(app)).join('');
                } else {
                    grid.innerHTML = '<p class="empty-state">No apps found. Go to Admin Panel to upload.</p>';
                }
            } catch(e) {
                grid.innerHTML = '<p class="error-state">Error loading data. Check connection.</p>';
            }
        }
        loadLatestApps();
    </script>
