<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AN1 Clone - Premium Mod APKs & Games</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">AN1<span>.Clone</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="category.html?c=Games">Games</a>
                <a href="category.html?c=Programs">Programs</a>
                <a href="admin.html" style="font-size: 12px; color: var(--text-muted);">Admin</a>
            </div>
            <div style="display:flex; align-items:center;">
                <form action="search.html" method="GET" class="search-bar">
                    <input type="text" name="q" placeholder="Search games & apps..." required>
                    <button type="submit">🔍</button>
                </form>
                <button id="theme-toggle" class="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 30px;">
        <h2 class="section-title">Latest Updates</h2>
        <div class="grid" id="latest-grid">
            <div class="loader"></div>
        </div>
    </div>

    <script type="module">
        import { db, ref, get, query, orderByChild } from './assets/js/firebase-config.js';
        import { createAppCard } from './assets/js/main.js';

        async function loadLatestApps() {
            const grid = document.getElementById('latest-grid');
            try {
                const snapshot = await get(ref(db, 'apps'));
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(key => ({id: key, ...data[key]}));
                    apps.sort((a,b) => b.timestamp - a.timestamp); // Newest first
                    
                    grid.innerHTML = apps.map(app => createAppCard(app)).join('');
                } else {
                    grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">No apps found. Go to Admin to upload.</p>';
                }
            } catch(e) {
                console.error(e);
                grid.innerHTML = '<p style="color:red; grid-column: 1/-1;">Error loading data.</p>';
            }
        }

        loadLatestApps();
    </script>
</body>
</html>
