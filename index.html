<body>

    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo" aria-label="AN1 Clone Homepage">AN1<span>.Clone</span></a>
            <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
            
            <nav class="nav-links" id="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>

                <form action="search.html" method="GET" class="search-bar mobile-search" role="search">
                    <input type="text" name="q" placeholder="Search games & apps..." required aria-label="Mobile Search">
                    <button type="submit" aria-label="Submit search">&#128269;</button>
                </form>
            </nav>

            <div class="header-actions">
                <form action="search.html" method="GET" class="search-bar desktop-search" role="search">
                    <input type="text" name="q" placeholder="Search games & apps..." required aria-label="Search">
                    <button type="submit" aria-label="Submit search">&#128269;</button>
                </form>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme">&#127769;</button>
            </div>
        </div>
    </header>


    <main class="container" style="margin-top: 24px; min-height: 60vh;">
        <h2 class="section-title">Latest Updates</h2>
        <div class="grid" id="latest-grid">
            <div class="loader"></div>
        </div>
    </main>
    <script type="module">
        import { db, ref, get } from './assets/js/firebase-config.js';
        import { createAppCard } from './assets/js/main.js';
        async function loadLatestApps() {
            const grid = document.getElementById('latest-grid');
            try {
                const snapshot = await get(ref(db, 'apps'));
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(key => ({id: key, ...data[key]}));
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    grid.innerHTML = apps.map(app => createAppCard(app)).join('');
                } else {
                    grid.innerHTML = '<p class="empty-state">No apps found. Go to Admin Panel to upload.</p>';
                }
            } catch(e) {
                grid.innerHTML = '<p class="error-state">Error loading data. Check connection.</p>';
            }
        }
        loadLatestApps();
    </script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const mobileToggle = document.getElementById('mobile-toggle');
        const navLinks = document.getElementById('nav-links');
        if (mobileToggle && navLinks) {
            mobileToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                const isActive = navLinks.classList.toggle('active');
                mobileToggle.setAttribute('aria-expanded', isActive ? 'true' : 'false');
            });
            // Close when clicking any nav link
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                });
            });
            // Close when tapping outside
            document.addEventListener('click', function(e) {
                if (!navLinks.contains(e.target) && e.target !== mobileToggle) {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                }
            });
            // Close on escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                }
            });
        }
    </script>


    <script type="module">
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        if(themeToggle) {
            themeToggle.innerHTML = currentTheme === 'dark' ? '&#9728;' : '&#127769;';
            themeToggle.addEventListener('click', () => {
                const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.innerHTML = newTheme === 'dark' ? '&#9728;' : '&#127769;';
            });
        }
    </script>

</body>
