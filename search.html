<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search - AN1 Clone</title>
    <meta name="description" content="Search for Android MOD APKs, games, and programs.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://krupaliba97-cell.github.io/an1-clone/search.html">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://via.placeholder.com/32/54b247/ffffff?text=A" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">AN1<span>.Clone</span></a>
            <div class="mobile-toggle" id="mobile-toggle">&#9776;</div>
            
            <div class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="category.html?c=Games">Games</a>
                <a href="category.html?c=Programs">Programs</a>
                
                <form action="search.html" method="GET" class="search-bar mobile-search">
                    <input type="text" name="q" placeholder="Search..." required>
                    <button type="submit">&#128269;</button>
                </form>
            </div>

            <div class="header-actions">
                <form action="search.html" method="GET" class="search-bar desktop-search">
                    <input type="text" name="q" placeholder="Search..." required>
                    <button type="submit">&#128269;</button>
                </form>
                <button id="theme-toggle" class="theme-toggle">&#127769;</button>
            </div>
        </div>
    </header>


    <div class="container" style="margin-top: 30px; min-height: 60vh;">
        <h2 class="section-title">Search Results for: <span id="search-query" style="color:var(--primary);"></span></h2>
        <div class="grid" id="search-grid">
            <div class="loader"></div>
        </div>
    </div>
    <script type="module">
        import { db, ref, get } from './assets/js/firebase-config.js';
        import { createAppCard } from './assets/js/main.js';
        const query = new URLSearchParams(window.location.search).get('q');
        document.getElementById('search-query').innerText = query || '';
        async function performSearch() {
            const grid = document.getElementById('search-grid');
            if(!query || query.trim() === '') return grid.innerHTML = '<p class="empty-state">Please enter a valid search term.</p>';
            try {
                const snapshot = await get(ref(db, 'apps'));
                if(snapshot.exists()) {
                    const qLower = query.toLowerCase();
                    let apps = Object.keys(snapshot.val()).map(key => ({id: key, ...snapshot.val()[key]})).filter(a => (a.title && a.title.toLowerCase().includes(qLower)) || (a.developer && a.developer.toLowerCase().includes(qLower)));
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    grid.innerHTML = apps.length ? apps.map(app => createAppCard(app)).join('') : '<p class="empty-state">No results found.</p>';
                } else {
                    grid.innerHTML = '<p class="empty-state">No apps in database.</p>';
                }
            } catch(e) {
                grid.innerHTML = '<p class="error-state">Error loading data.</p>';
            }
        }
        performSearch();
    </script>
        

    <footer>
        <div class="container footer-content">
            <div class="footer-col">
                <h3>AN1 Clone</h3>
                <p>Premium source for Android MOD APKs.</p>
                <div class="contact-links">
                    <a href="mailto:support@an1clone.com">&#9993; support@an1clone.com</a><br>
                    <a href="tel:+1234567890">&#128222; +1 234 567 890</a>
                </div>
            </div>
            <div class="footer-col">
                <h3>Explore</h3>
                <a href="index.html">Home</a>
                <a href="category.html?c=Games">Games</a>
                <a href="category.html?c=Programs">Programs</a>
            </div>
            <div class="footer-col">
                <h3>Legal</h3>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="dmca.html">DMCA</a>
            </div>
        </div>
        <div class="copyright">
            &copy; <span id="year"></span> AN1 Clone. All rights reserved.
        </div>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('mobile-toggle').addEventListener('click', function() {
            document.getElementById('nav-links').classList.toggle('active');
        });
    </script>


    <script type="module">
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        if(themeToggle) {
            themeToggle.innerHTML = currentTheme === 'dark' ? '&#9728;' : '&#127769;';
            themeToggle.addEventListener('click', () => {
                const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.innerHTML = newTheme === 'dark' ? '&#9728;' : '&#127769;';
            });
        }
    </script>

</body>
</html>
