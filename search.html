<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - AN1 Clone</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">AN1<span>.Clone</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="category.html?c=Games">Games</a>
                <a href="category.html?c=Programs">Programs</a>
                <a href="admin.html" style="font-size: 12px; color: var(--text-muted);">Admin</a>
            </div>
            <div style="display:flex; align-items:center;">
                <form action="search.html" method="GET" class="search-bar">
                    <input type="text" name="q" placeholder="Search games & apps..." required>
                    <button type="submit">🔍</button>
                </form>
                <button id="theme-toggle" class="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 30px;">
        <h2 class="section-title">Search Results for: <span id="search-query" style="color:var(--primary);"></span></h2>
        <div class="grid" id="search-grid">
            <div class="loader"></div>
        </div>
    </div>

    <script type="module">
        import { db, ref, get } from './assets/js/firebase-config.js';
        import { createAppCard } from './assets/js/main.js';

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        document.getElementById('search-query').innerText = query || '';

        async function performSearch() {
            const grid = document.getElementById('search-grid');
            if(!query) {
                grid.innerHTML = '<p>Please enter a search term.</p>';
                return;
            }

            try {
                const snapshot = await get(ref(db, 'apps'));
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(key => ({id: key, ...data[key]}));
                    
                    const qLower = query.toLowerCase();
                    apps = apps.filter(a => 
                        (a.title && a.title.toLowerCase().includes(qLower)) || 
                        (a.developer && a.developer.toLowerCase().includes(qLower))
                    );
                    
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    
                    if(apps.length > 0) {
                        grid.innerHTML = apps.map(app => createAppCard(app)).join('');
                    } else {
                        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No results found.</p>';
                    }
                } else {
                    grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No apps found in database.</p>';
                }
            } catch(e) {
                console.error(e);
                grid.innerHTML = '<p style="color:red; grid-column: 1/-1;">Error loading data.</p>';
            }
        }

        performSearch();
    </script>
</body>
</html>
