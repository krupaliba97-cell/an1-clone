<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AN1 Clone Admin Dashboard - Manage Apps securely">
    <link rel="icon" href="https://via.placeholder.com/32/54b247/ffffff?text=A" type="image/png">
    <title>Secure Admin Dashboard - AN1 Pro Clone</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: var(--bg-color); }
        .admin-wrap { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px;}
        .admin-form-col { flex: 1; min-width: 300px; }
        .admin-list-col { flex: 1; min-width: 300px; background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border-color);}
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .list-item img { width: 40px; height: 40px; border-radius: 8px; margin-right: 10px; }
        .list-info { flex: 1; }
        .list-actions button { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        
        #login-section { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid var(--border-color); }
        #login-section h2 { margin-bottom: 20px; color: var(--primary); }
        .auth-error { color: #e74c3c; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo">AN1<span>.Admin</span></a>
            <div class="nav-links">
                <a href="index.html">View Site</a>
                <button id="logout-btn" style="display:none; background:transparent; border:none; color:var(--text-main); font-weight:bold; cursor:pointer;">Logout</button>
            </div>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </header>

    <!-- Authentication Section -->
    <div class="container" id="login-section">
        <h2>Secure Login</h2>
        <div id="auth-error" class="auth-error"></div>
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="auth-email" placeholder="Admin Email" required style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px;">
            </div>
            <div class="form-group">
                <input type="password" id="auth-password" placeholder="Password" required style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px;">
            </div>
            <button type="submit" class="download-btn" style="width:100%; max-width:none; padding:12px;">Login</button>
        </form>
        <p style="margin-top:20px; font-size:12px; color:var(--text-muted);">
            Don't have an account? Create one in your Firebase Console -> Authentication.
        </p>
    </div>

    <!-- Secure Dashboard Section -->
    <div class="container admin-wrap" id="admin-section" style="display:none;">
        <!-- Add App Form -->
        <div class="admin-form-col">
            <div class="admin-form" style="margin:0;">
                <h2 class="section-title" style="margin-top:0;">Publish New App/Game</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="category">
                                <option value="Games">Games</option>
                                <option value="Programs">Programs</option>
                                <option value="News">News</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Developer</label>
                            <input type="text" id="developer" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Version</label>
                            <input type="text" id="version" placeholder="e.g. 1.2.0">
                        </div>
                        <div class="form-group">
                            <label>Size</label>
                            <input type="text" id="size" placeholder="e.g. 150 MB">
                        </div>
                    </div>
                    
                    <div class="form-group" style="display:flex; align-items:center; gap: 10px;">
                        <input type="checkbox" id="is_mod" style="width:20px;height:20px;"> 
                        <label style="margin:0; font-size:16px; color:var(--badge-mod);">This is a MOD APK</label>
                    </div>

                    <div class="form-group">
                        <label>App Icon * (Image File)</label>
                        <input type="file" id="image" accept="image/*" required style="background:transparent; border:none; padding:0;">
                    </div>

                    <div class="form-group">
                        <label>Download APK URL *</label>
                        <input type="url" id="download_url" placeholder="https://..." required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="5" placeholder="Detailed app description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>What's New (Optional)</label>
                        <textarea id="whats_new" rows="3" placeholder="Changelog for this version..."></textarea>
                    </div>

                    <button type="submit" class="download-btn" id="submitBtn" style="width:100%; max-width:none;">Upload & Publish</button>
                    <div id="status" style="margin-top:15px; font-weight:bold; text-align:center;"></div>
                </form>
            </div>
        </div>

        <!-- Manage Apps List -->
        <div class="admin-list-col">
            <h2 class="section-title" style="margin-top:0;">Manage Published</h2>
            <div id="admin-apps-list">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, storage, auth, ref, push, set, get, onValue, storageRef, uploadBytes, getDownloadURL, signInWithEmailAndPassword, signOut, onAuthStateChanged } from './assets/js/firebase-config.js';
        import { remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const logoutBtn = document.getElementById('logout-btn');
        
        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                adminSection.style.display = 'flex';
                logoutBtn.style.display = 'inline-block';
                loadApps();
            } else {
                loginSection.style.display = 'block';
                adminSection.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errDiv.innerText = '';
            } catch (error) {
                errDiv.innerText = error.message;
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Load Apps List
        function loadApps() {
            const appsListDiv = document.getElementById('admin-apps-list');
            onValue(ref(db, 'apps'), (snapshot) => {
                appsListDiv.innerHTML = '';
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(k => ({id: k, ...data[k]}));
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    
                    apps.forEach(app => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerHTML = `
                            <div style="display:flex; align-items:center; flex:1;">
                                <img src="${app.image_url || 'https://via.placeholder.com/40'}" alt="">
                                <div class="list-info">
                                    <div style="font-weight:bold; color:var(--text-main);">${app.title}</div>
                                    <div style="font-size:12px; color:var(--text-muted);">${app.category} | ${app.is_mod ? 'MOD' : 'Orig'}</div>
                                </div>
                            </div>
                            <div class="list-actions">
                                <button onclick="deleteApp('${app.id}')">Delete</button>
                            </div>
                        `;
                        appsListDiv.appendChild(item);
                    });
                } else {
                    appsListDiv.innerHTML = '<p>No apps published.</p>';
                }
            });
        }

        // Global Delete Function
        window.deleteApp = async function(id) {
            if(confirm('Are you sure you want to delete this app?')) {
                try {
                    await remove(ref(db, 'apps/' + id));
                    alert('Deleted successfully.');
                } catch(e) {
                    alert('Permission Denied: You must be logged in as an Admin.');
                }
            }
        }

        // Upload Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Uploading Image to Cloud Storage...";
            status.style.color = "var(--primary)";

            try {
                // Upload Image
                const file = document.getElementById('image').files[0];
                const sRef = storageRef(storage, 'icons/' + Date.now() + '_' + file.name);
                await uploadBytes(sRef, file);
                const imageUrl = await getDownloadURL(sRef);

                status.innerText = "Publishing to Realtime Database...";

                // Save to DB
                const appData = {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    developer: document.getElementById('developer').value,
                    version: document.getElementById('version').value,
                    size: document.getElementById('size').value,
                    description: document.getElementById('description').value,
                    whats_new: document.getElementById('whats_new').value,
                    is_mod: document.getElementById('is_mod').checked,
                    download_url: document.getElementById('download_url').value,
                    image_url: imageUrl,
                    timestamp: Date.now()
                };

                const newAppRef = push(ref(db, 'apps'));
                await set(newAppRef, appData);

                status.innerText = "Successfully Published! It is now Live.";
                document.getElementById('uploadForm').reset();
            } catch (err) {
                console.error(err);
                status.innerText = "Error: Permission Denied. You are not authenticated.";
                status.style.color = "red";
            } finally {
                btn.disabled = false;
                setTimeout(() => status.innerText = "", 5000);
            }
        });
    </script>
    <script src="assets/js/main.js" type="module"></script>
</body>
</html>
