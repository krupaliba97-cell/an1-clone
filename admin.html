<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="APKQube Admin Dashboard - Manage Apps securely">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2354b247'/><path d='M50 24 C36 24 25 35 25 50 C25 65 36 76 50 76 C55.5 76 60.5 74.2 64.5 71 L72 78.5 L78.5 72 L71 64.5 C74.2 60.5 76 55.5 76 50 C76 35 65 24 50 24 Z M50 35 C58.3 35 65 41.7 65 50 C65 58.3 58.3 65 50 65 C41.7 65 35 58.3 35 50 C35 41.7 41.7 35 50 35 Z' fill='white'/></svg>">
    <title>Secure Admin Dashboard - APKQube.com</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo" aria-label="APKQube Admin">APK<span>Qube</span>.Admin</a>
            <div class="nav-links">
                <a href="index.html">View Site</a>
                <button id="logout-btn" style="display:none; background:transparent; border:none; color:var(--text-main); font-weight:bold; cursor:pointer;">Logout</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"><svg class="icon icon-theme" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        </div>
    </header>

    <!-- Authentication Section -->
    <div class="container" id="login-section">
        <h2>Secure Login</h2>
        <div id="auth-error" class="auth-error"></div>
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="auth-email" placeholder="Admin Email" required style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px;">
            </div>
            <div class="form-group">
                <input type="password" id="auth-password" placeholder="Password" required style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px;">
            </div>
            <button type="submit" class="download-btn" style="width:100%; max-width:none; padding:12px;">Login</button>
        </form>
        <p style="margin-top:20px; font-size:12px; color:var(--text-muted);">
            Don't have an account? Create one in your Firebase Console -> Authentication.
        </p>
    </div>

    <!-- Secure Dashboard Section -->
    <div class="container admin-wrap" id="admin-section" style="display:none;">
        <!-- Add App Form -->
        <div class="admin-form-col">
            <div class="admin-form" style="margin:0;">
                <h2 class="section-title" style="margin-top:0;">Publish New App/Game</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" required maxlength="120">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="category">
                                <option value="Games">Games</option>
                                <option value="Programs">Programs</option>
                                <option value="News">News</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Developer</label>
                            <input type="text" id="developer" required maxlength="80">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Version</label>
                            <input type="text" id="version" placeholder="e.g. 1.2.0" maxlength="40">
                        </div>
                        <div class="form-group">
                            <label>Size</label>
                            <input type="text" id="size" placeholder="e.g. 150 MB" maxlength="40">
                        </div>
                    </div>
                    
                    <div class="form-group" style="display:flex; align-items:center; gap: 10px;">
                        <input type="checkbox" id="is_mod" style="width:20px;height:20px;"> 
                        <label style="margin:0; font-size:16px; color:var(--badge-mod);">This is a MOD APK</label>
                    </div>

                    <div class="form-group">
                        <label>App Icon * (Image File)</label>
                        <input type="file" id="image" accept="image/*" required style="background:transparent; border:none; padding:0;">
                    </div>

                    <div class="form-group">
                        <label>Download APK URL *</label>
                        <input type="url" id="download_url" placeholder="https://..." required maxlength="500">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="5" maxlength="5000" placeholder="Detailed app description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>What's New (Optional)</label>
                        <textarea id="whats_new" rows="3" maxlength="2000" placeholder="Changelog for this version..."></textarea>
                    </div>

                    <button type="submit" class="download-btn" id="submitBtn" style="width:100%; max-width:none;">Upload & Publish</button>
                    <div id="status" style="margin-top:15px; font-weight:bold; text-align:center;"></div>
                </form>
            </div>
        </div>

        <!-- Manage Apps List -->
        <div class="admin-list-col">
            <h2 class="section-title" style="margin-top:0;">Manage Published</h2>
            <div id="admin-apps-list">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, storage, auth, ref, push, set, get, onValue, storageRef, uploadBytes, getDownloadURL, signInWithEmailAndPassword, signOut, onAuthStateChanged } from './assets/js/firebase-config.js';
        import { remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        import { escapeHTML, sanitizeUrl } from "./assets/js/main.js";
        
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const logoutBtn = document.getElementById('logout-btn');
        
        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                adminSection.style.display = 'flex';
                logoutBtn.style.display = 'inline-block';
                loadApps();
            } else {
                loginSection.style.display = 'block';
                adminSection.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errDiv.innerText = '';
            } catch (error) {
                errDiv.innerText = error.message;
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Load Apps List
        function loadApps() {
            const appsListDiv = document.getElementById('admin-apps-list');
            onValue(ref(db, 'apps'), (snapshot) => {
                appsListDiv.innerHTML = '';
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    let apps = Object.keys(data).map(k => ({id: k, ...data[k]}));
                    apps.sort((a,b) => b.timestamp - a.timestamp);
                    
                    apps.forEach(app => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        const safeTitle = escapeHTML(app.title || 'Untitled');
                        const safeCat = escapeHTML(app.category || 'App');
                        const safeImg = sanitizeUrl(app.image_url, 'https://via.placeholder.com/40');
                        const safeId = encodeURIComponent(app.id || '');
                        item.innerHTML = `
                            <div style="display:flex; align-items:center; flex:1;">
                                <img src="${safeImg}" alt="">
                                <div class="list-info">
                                    <div style="font-weight:bold; color:var(--text-main);">${safeTitle}</div>
                                    <div style="font-size:12px; color:var(--text-muted);">${safeCat} | ${app.is_mod ? 'MOD' : 'Orig'}</div>
                                </div>
                            </div>
                            <div class="list-actions">
                                <button data-id="${safeId}" class="delete-btn">Delete</button>
                            </div>
                        `;
                        item.querySelector('.delete-btn').addEventListener('click', (e) => {
                            window.deleteApp(decodeURIComponent(e.target.getAttribute('data-id')));
                        });
                        appsListDiv.appendChild(item);
                    });
                } else {
                    appsListDiv.innerHTML = '<p>No apps published.</p>';
                }
            });
        }

        // Global Delete Function
        window.deleteApp = async function(id) {
            if(confirm('Are you sure you want to delete this app?')) {
                try {
                    await remove(ref(db, 'apps/' + id));
                    alert('Deleted successfully.');
                } catch(e) {
                    alert('Permission Denied: You must be logged in as an Admin.');
                }
            }
        }

        // Upload Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Uploading Image to Cloud Storage...";
            status.style.color = "var(--primary)";

            try {
                // Upload Image
                const file = document.getElementById('image').files[0];
                const sRef = storageRef(storage, 'icons/' + Date.now() + '_' + file.name);
                await uploadBytes(sRef, file);
                const imageUrl = await getDownloadURL(sRef);

                status.innerText = "Publishing to Realtime Database...";

                // Save to DB
                const appData = {
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    developer: document.getElementById('developer').value,
                    version: document.getElementById('version').value,
                    size: document.getElementById('size').value,
                    description: document.getElementById('description').value,
                    whats_new: document.getElementById('whats_new').value,
                    is_mod: document.getElementById('is_mod').checked,
                    download_url: document.getElementById('download_url').value,
                    image_url: imageUrl,
                    timestamp: Date.now()
                };

                const newAppRef = push(ref(db, 'apps'));
                await set(newAppRef, appData);

                status.innerText = "Successfully Published! It is now Live.";
                document.getElementById('uploadForm').reset();
            } catch (err) {
                console.error(err);
                status.innerText = "Error: Permission Denied. You are not authenticated.";
                status.style.color = "red";
            } finally {
                btn.disabled = false;
                setTimeout(() => status.innerText = "", 5000);
            }
        });
    </script>
    <script type="module">
        const themeToggle = document.getElementById('theme-toggle');
        const sunSvg = `<svg class="icon icon-theme" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonSvg = `<svg class="icon icon-theme" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        if(themeToggle) {
            themeToggle.innerHTML = currentTheme === 'dark' ? sunSvg : moonSvg;
            themeToggle.addEventListener('click', () => {
                const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.innerHTML = newTheme === 'dark' ? sunSvg : moonSvg;
            });
        }
    </script>
</body>
</html>
