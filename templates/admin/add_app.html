<!DOCTYPE html>
<html>
<head>
    <title>Add App/Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body style="padding: 20px;">
    <div class="container" style="max-width: 800px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2>Add New App or Game</h2>
        <br>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required placeholder="e.g. Temple Run 2">
            </div>
            
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Developer</label>
                <input type="text" name="developer" placeholder="e.g. Imangi Studios">
            </div>

            <div class="form-group">
                <label>Version</label>
                <input type="text" name="version" placeholder="e.g. 1.112.0">
            </div>

            <div class="form-group">
                <label>Size</label>
                <input type="text" name="size" placeholder="e.g. 150 MB">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="5"></textarea>
            </div>
            
            <div class="form-group">
                <label>Is this a MOD?</label>
                <input type="checkbox" name="is_mod" value="1"> Yes, it has mod features
            </div>

            <div class="form-group">
                <label>App Icon Image</label>
                <input type="file" name="image" accept="image/*">
            </div>
            
            <div class="form-group">
                <label>APK Download Link</label>
                <input type="text" name="download_url" placeholder="https://..." required>
            </div>

            <button type="submit" class="btn btn-green">Upload to Site</button>
            <a href="{{ url_for('admin_dashboard') }}" style="margin-left: 15px; color: #888;">Cancel</a>
        </form>
    </div>
</body>
</html>
