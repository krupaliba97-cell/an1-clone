    <main class="container" id="app-container" style="min-height: 60vh;">
        <div class="loader" style="margin-top: 50px;"></div>
    </main>
    <script type="module">
        import { db, ref, get } from './assets/js/firebase-config.js';
        window.startDownloadTimer = function(url) {
            const btn = document.getElementById('download-btn');
            if(!url || url === 'undefined' || url === 'null' || url.trim() === '') { 
                btn.innerHTML = 'Link Unavailable';
                btn.style.background = '#ef4444';
                btn.style.pointerEvents = 'none';
                return; 
            }
            let timeLeft = 3;
            btn.innerHTML = 'Please wait ' + timeLeft + 's...';
            btn.style.background = "#6b7280";
            btn.style.pointerEvents = "none";
            const timer = setInterval(() => {
                timeLeft--;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    btn.innerHTML = 'Click here to Download';
                    btn.style.background = "var(--primary)";
                    btn.style.pointerEvents = "auto";
                    btn.onclick = () => { window.open(url, '_blank'); };
                } else {
                    btn.innerHTML = 'Please wait ' + timeLeft + 's...';
                }
            }, 1000);
        }
        async function loadAppDetails() {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('app-container');
            if(!id) return container.innerHTML = '<p class="error-state">No App ID provided.</p>';
            try {
                const snapshot = await get(ref(db, 'apps/' + id));
                if(snapshot.exists()) {
                    const app = snapshot.val();
                    const updateDate = new Date(app.timestamp).toLocaleDateString();
                    document.title = (app.title || 'App') + " MOD APK Download - AN1 Clone";
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if(metaDesc) metaDesc.setAttribute('content', 'Download ' + (app.title || 'App') + ' MOD APK v' + (app.version || '') + ' for Android. ' + (app.size || '') + ' free download.');
                    container.innerHTML = 
                        '<article class="app-header">' +
                            '<img src="' + (app.image_url || 'https://via.placeholder.com/150') + '" class="app-icon" alt="' + (app.title || 'App') + '" width="110" height="110">' +
                            '<div class="app-info">' +
                                '<h1>' + (app.title || 'Unknown') + (app.is_mod ? ' <span class="mod-badge-inline">MOD</span>' : '') + '</h1>' +
                                '<a href="search.html?q=' + encodeURIComponent(app.developer || '') + '" class="dev">' + (app.developer || 'Unknown') + '</a>' +
                                '<div class="app-specs">' +
                                    '<div><strong>Version</strong> ' + (app.version || 'Varies') + '</div>' +
                                    '<div><strong>Size</strong> ' + (app.size || 'Varies') + '</div>' +
                                    '<div><strong>Category</strong> ' + (app.category || 'App') + '</div>' +
                                    '<div><strong>Updated</strong> ' + updateDate + '</div>' +
                                '</div>' +
                            '</div>' +
                        '</article>' +
                        '<div style="text-align:center; padding: 16px 0;">' +
                            '<button id="download-btn" class="download-btn" onclick="startDownloadTimer(\'' + (app.download_url || '').replace(/'/g, "\\'") + '\')">Download APK</button>' +
                        '</div>' +
                        '<section class="app-content">' +
                            '<h3>Description</h3>' +
                            '<div style="white-space: pre-wrap;">' + (app.description || 'No description provided.') + '</div>' +
                            (app.whats_new ? '<h3>What\'s New</h3><div style="white-space: pre-wrap;">' + app.whats_new + '</div>' : '') +
                        '</section>';
                } else {
                    container.innerHTML = '<p class="error-state">App not found.</p>';
                }
            } catch(e) {
                console.error(e);
                container.innerHTML = '<p class="error-state">Error loading app data.</p>';
            }
        }
        loadAppDetails();
    </script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const mobileToggle = document.getElementById('mobile-toggle');
        const navLinks = document.getElementById('nav-links');
        if (mobileToggle && navLinks) {
            mobileToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                const isActive = navLinks.classList.toggle('active');
                mobileToggle.setAttribute('aria-expanded', isActive ? 'true' : 'false');
            });
            // Close when clicking any nav link
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                });
            });
            // Close when tapping outside
            document.addEventListener('click', function(e) {
                if (!navLinks.contains(e.target) && e.target !== mobileToggle) {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                }
            });
            // Close on escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    navLinks.classList.remove('active');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                }
            });
        }
    </script>


    <script type="module">
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        if(themeToggle) {
            themeToggle.innerHTML = currentTheme === 'dark' ? '&#9728;' : '&#127769;';
            themeToggle.addEventListener('click', () => {
                const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.innerHTML = newTheme === 'dark' ? '&#9728;' : '&#127769;';
            });
        }
    </script>

</body>
